name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Least-privilege default for GITHUB_TOKEN. The test job runs PR-controlled
# code (npm scripts, checkout) and must never hold a write credential.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test-app/package-lock.json

      # Install against public npm only; the pinned .npmrc guarantees no
      # internal/private registry is inherited from a runner or contributor.
      - name: Install root dependencies
        run: npm ci

      - name: Install test-app dependencies
        run: npm ci --prefix test-app

      # Runs the full spec harness with coverage. --watch=false makes karma
      # exit non-zero on any spec failure, gating the build. Chrome is
      # preinstalled on ubuntu-latest runners and used headless via karma.conf.
      - name: Run test-app harness with coverage
        run: npm --prefix test-app test

      # Coverage is reported here (karma text-summary in the log above, plus the
      # lcov artifact below). Enforcement of the 80% new-code floor (target 90%)
      # is tracked by #576 and applied once the green baseline number is set.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-app-coverage
          path: test-app/coverage/**
          if-no-files-found: warn
          retention-days: 30
