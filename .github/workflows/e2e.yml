name: E2E

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  smoke:
    name: Playwright smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # test-app compiles the library straight from the root `src/` tree
      # (not from a published/installed package), so the root `node_modules`
      # (@angular/core, @angular/cdk, rxjs, zone.js, etc. -- peerDependencies
      # of the root package) must be present too, or esbuild can't resolve
      # those imports from the library source files. `npm ci` (not `npm
      # install --no-package-lock`) so this job resolves the exact versions
      # pinned in package-lock.json, same as ci.yml -- otherwise an upstream
      # major bump (e.g. rxjs 8) could silently enter this build unpinned.
      - name: Install root dependencies
        run: npm ci
      - name: Install test-app dependencies
        run: npm ci --prefix test-app
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: test-app
      - name: Run Playwright smoke test
        run: npm run test:e2e
        working-directory: test-app
      - name: Upload Playwright test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-app/test-results/
          if-no-files-found: ignore
